version: 2

project_name: hookwatch

env:
  - GO111MODULE=on

before:
  hooks:
    - sh -c "cd frontend && npm ci"
    - sh -c "cd frontend && npm run build"

builds:
  - id: hookwatch
    main: .
    binary: hookwatch
    ldflags:
      - -s -w -X hookwatch/server.Version={{.Version}} -X hookwatch/server.Commit={{.Commit}} -X hookwatch/server.Date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: hookwatch
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  draft: true
  prerelease: auto
  mode: append
  header: |
    ## HookWatch {{ .Version }}

    Download and run:

    ```bash
    ./hookwatch
    ```

    Then open http://localhost:8877 in your browser.

    ### Test it

    ```bash
    curl -X POST http://localhost:8877/test -d '{"hello":"world"}'
    ```
