version: 2

project_name: hookwatch

env:
  - GO111MODULE=on

before:
  hooks:
    - dir: server
      cmd: go mod tidy
    - dir: frontend
      cmd: npm ci
    - dir: frontend
      cmd: npm run build

builds:
  - id: hookwatch
    dir: server
    main: .
    binary: hookwatch
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: hookwatch
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - src: frontend/dist/*
        dst: frontend-dist
        strip_parent: true
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  draft: true
  prerelease: auto
  mode: append
  header: |
    ## HookWatch {{ .Version }}

    Download the latest archive for your platform, extract, and run:

    ```bash
    ./hookwatch --port 8877 --static-dir ./frontend-dist
    ```

    Then open http://localhost:8877 in your browser.

    ### Test it

    ```bash
    curl -X POST http://localhost:8877/test -d '{"hello":"world"}'
    ```
