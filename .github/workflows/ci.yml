name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Go server
        run: |
          cd server
          go build -v ./...

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit
